<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — Our Wedding Weekend</title>
<meta property="og:title" content="Music — Our Wedding Weekend">
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
.g0{--rows-m:9;--rows-d:10}
.g0b0{grid-area:2/2/9/10;z-index:0;--v:center}
@media(min-width:768px){.g0b0{grid-area:3/5/9/23;z-index:0;--v:center}}
.g1{--rows-m:36;--rows-d:9}
.g1b0{grid-area:2/2/9/10;z-index:0;--v:start}
@media(min-width:768px){.g1b0{grid-area:3/7/5/21;z-index:0;--v:start}}
.g1b1{grid-area:9/2/10/10;z-index:3;--v:center}
@media(min-width:768px){.g1b1{grid-area:5/8/7/20;z-index:3;--v:center}}
.g1b2{grid-area:10/2/37/10;z-index:2;--v:start}
@media(min-width:768px){.g1b2{grid-area:7/8/8/20;z-index:2;--v:start}}
.gf{--rows-m:5;--rows-d:3}
.gfb0{grid-area:2/2/5/10;z-index:0;--v:start}
@media(min-width:768px){.gfb0{grid-area:2/2/4/26;z-index:0;--v:start}}
</style>
<script src="/assets/js/site.js" defer></script>
</head>
<body>
<header class="site-header" data-theme="black">
<div class="header-bar">
<div class="header-desktop">
<div class="header-title-nav">
<nav class="header-nav" aria-label="Main"><a class="nav-link" href="/faqs">FAQs</a><a class="nav-link" href="/when-where">When &amp; Where</a><a class="nav-link is-active" href="/music" aria-current="page">Music</a><a class="nav-link" href="/activities">Activities</a></nav>
<div class="site-title"><a href="/">Our Wedding Weekend</a></div>
</div>
<div class="header-actions"><a class="btn btn-header" href="/photos">Photos</a></div>
</div>
<div class="header-mobile">
<div class="site-title"><a href="/">Our Wedding Weekend</a></div>
<button class="burger" type="button" aria-label="Open Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
</div>
</div>
</header>
<div class="menu-overlay" id="menu" data-theme="light" hidden>
<nav class="menu-nav" aria-label="Mobile"><div class="menu-item"><a class="menu-link" href="/faqs">FAQs</a></div><div class="menu-item"><a class="menu-link" href="/when-where">When &amp; Where</a></div><div class="menu-item"><a class="menu-link is-active" href="/music" aria-current="page">Music</a></div><div class="menu-item"><a class="menu-link" href="/activities">Activities</a></div></nav>
<div class="menu-cta"><a class="btn btn-header" href="/photos">Photos</a></div>
</div>
<main>
<section class="section h-custom has-bg" data-theme="black">
<div class="section-bg"><img src="/assets/img/music-turntable.jpg" alt="" style="object-position:50% 50%" decoding="async" fetchpriority="high"><div class="section-overlay" style="opacity:0.15"></div></div>
<div class="section-content">
<div class="grid g0">
<div class="blk blk-text g0b0">
<div class="text">
<h2 class="ta-c">Music</h2>
</div>
</div>
</div>
</div>
</section>
<section class="section h-custom">
<div class="section-content">
<div class="grid g1">
<div class="blk blk-text g1b0">
<div class="text">
<h3 class="ta-c">Tell us what songs you want to hear</h3>
</div>
</div>
<div class="blk blk-hr g1b1">
<hr>
</div>
<div class="blk blk-form g1b2">
<form class="form" onsubmit="return false" novalidate>
<div class="form-item field"><label class="form-title" for="song-name"><span>Song Name</span><span class="req">(required)</span></label><input id="song-name" type="text"></div>
<div class="form-item field"><label class="form-title" for="artist"><span>Artist</span><span class="req">(required)</span></label><input id="artist" type="text"></div>
<div class="form-submit"><button type="submit" class="btn btn-form">Send</button></div>
</form>
</div>
</div>
</div>
</section>
</main>
<footer class="site-footer">
<section class="section h-custom" data-theme="bright">
<div class="section-content">
<div class="grid gf">
<div class="blk blk-text gfb0">
<div class="text">
<h4 class="ta-c">Hannah &amp; Graham</h4>
</div>
</div>
</div>
</div>
</section>
</footer>
</body>
</html>
